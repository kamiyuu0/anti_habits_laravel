services:
    db:
        image: mysql:8.4
        restart: always
        environment:
            TZ: Asia/Tokyo
            MYSQL_ROOT_PASSWORD: password
            MYSQL_DATABASE: myapp_development
        command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
        volumes:
            - mysql_data:/var/lib/mysql
        ports:
            - 3306:3306
        healthcheck:
            test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -ppassword"]
            interval: 10s
            timeout: 5s
            retries: 5
    web:
        build:
            context: .
            dockerfile: Dockerfile.dev
        command: bash -c "composer install && npm install && ([ -f .env ] || (cp .env.example .env && php artisan key:generate)) && php artisan migrate && npx concurrently -n web,vite,schedule 'php artisan serve --host=0.0.0.0 --port=8000' 'npm run dev -- --host 0.0.0.0' 'php artisan schedule:work'"
        tty: true
        stdin_open: true
        volumes:
            - .:/myapp
            - vendor:/myapp/vendor
            - node_modules:/myapp/node_modules
        environment:
            TZ: Asia/Tokyo
            DB_HOST: db
        ports:
            - "8000:8000"
            - "5173:5173"
        depends_on:
            db:
                condition: service_healthy
volumes:
    mysql_data:
    vendor:
    node_modules:
